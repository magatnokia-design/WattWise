name: Dependency audit

# Runs on every push and once a week. The weekly run is the point: a repository
# with no commits is not a repository with no vulnerabilities, and most advisories
# land against code that has not changed.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 09:00 Manila, Mondays (01:00 UTC).
    - cron: '0 1 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    strategy:
      # Report on both even if one fails, otherwise a failure in the app hides
      # the state of the backend.
      fail-fast: false
      matrix:
        include:
          - name: app
            path: .
            # The app's remaining highs are all build and dev-client tooling -
            # currently expo-dev-client, expo-dev-launcher and expo-manifests,
            # earlier metro, @expo/cli and postcss. None is imported from src/;
            # they run on a developer machine or in a dev build and are not in
            # the shipped bundle. Which packages sit here moves with the SDK, so
            # treat the list as an example rather than a fixed set - the test is
            # whether the advisory reaches the release APK, not its name.
            # Clearing them needs an Expo SDK major, so this gate is set at
            # critical to stay honest rather than permanently red.
            level: critical
          - name: functions
            path: functions
            # The backend is the one that actually faces the internet, so it is
            # held to a stricter line.
            level: high

    name: audit (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `npm audit` exits 1 for two completely different things: it found
      # vulnerabilities, and it could not reach the registry. Treating them the
      # same is how a security gate becomes a red X people learn to ignore -
      # which happened on 4 Sep 2026, when registry.npmjs.org returned 503 for
      # about ten minutes and this job simply reported failure.
      #
      # So: retry a transient registry error, and if it never clears, report a
      # SKIPPED audit rather than a failed one. A real finding still fails the
      # job on the first attempt, with no retry and no delay.
      - name: Audit ${{ matrix.name }}
        working-directory: ${{ matrix.path }}
        # npm retries a dead endpoint for minutes on its own; this run took 11
        # before it gave up. Cap it so a bad day costs a minute, not a coffee.
        timeout-minutes: 8
        env:
          LEVEL: ${{ matrix.level }}
          NAME: ${{ matrix.name }}
        run: |
          # Fail fast on a dead registry rather than letting npm grind.
          npm config set fetch-retries 2
          npm config set fetch-retry-maxtimeout 20000

          # Anything here means "the audit could not run", not "the audit found
          # something". Matched against the combined output, not the exit code.
          UNREACHABLE='audit endpoint returned an error|Service Unavailable|503|ENOTFOUND|EAI_AGAIN|ETIMEDOUT|ECONNRESET|network'

          for attempt in 1 2 3; do
            if out=$(npm audit --audit-level="$LEVEL" 2>&1); then
              echo "$out"
              echo "::notice::$NAME: no vulnerabilities at $LEVEL or above."
              exit 0
            fi

            if printf '%s' "$out" | grep -qiE "$UNREACHABLE"; then
              echo "::warning::$NAME: npm registry unreachable (attempt $attempt of 3). Retrying."
              sleep $((attempt * 20))
              continue
            fi

            # A real finding. Print it and stop - there is nothing transient here.
            echo "$out"
            echo "::error::$NAME: vulnerabilities found at $LEVEL or above."
            exit 1
          done

          echo "$out"
          echo "::warning::$NAME: AUDIT SKIPPED - npm registry was unreachable after 3 attempts. This is not a clean result; re-run this workflow once the registry recovers."
          exit 0

      - name: Full report (informational)
        # Always runs, so a failure above is read next to the whole picture
        # rather than just the first thing that tripped it.
        if: always()
        working-directory: ${{ matrix.path }}
        # The timeout has to live INSIDE the shell, not in timeout-minutes. A
        # step timeout kills the step and fails the job, and `|| true` never gets
        # to run - which is exactly how this "informational" step failed a run
        # whose actual audit had already passed. `timeout` exits 124, the shell
        # stays alive, and `|| true` swallows it as intended.
        run: timeout 240 npm audit || true
